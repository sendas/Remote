name: Compilar Sala de Aula

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar servidor e agente
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SalaDeAula-Servidor
          path: publish/server
      - uses: actions/upload-artifact@v4
        with:
          name: SalaDeAula-Agente
          path: publish/agent
